name: dom_builder
description: Generate and manipulate DOM elements (virtual or real), DSX (like JSX) and HTML declarations (Web and Native support).
version: 3.2.0
homepage: https://github.com/gmpassos/dom_builder

environment:
  sdk: ^3.13.0

dependencies:
  web_utils: ^1.1.0
  js_interop_utils: ^1.1.0
  html: ^0.15.7
  swiss_knife: ^3.3.14
  collection: ^1.19.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
  dependency_validator: ^5.1.0
  coverage: ^1.15.1
  web: ^1.1.1

